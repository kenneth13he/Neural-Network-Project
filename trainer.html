<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neural Network Trainer</title>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.27.8/full/pyodide.js"></script>
</head>
<body>

  <h1>Watch a neural network learn</h1>
  <p>Click to place a blue dot. Shift-click to place a red dot. Press Train and watch the network learn to separate them.</p>

  <p id="message">Loading Python...</p>

  <p>
    <button id="train-button">Train</button>
    <button id="clear-button">Clear dots</button>
    <button id="reset-button">New network</button>
  </p>

  <p>
    Step: <span id="step">0</span>
    &nbsp; Loss: <span id="loss">-</span>
    &nbsp; Accuracy: <span id="accuracy">-</span>
  </p>

  <canvas id="board" width="400" height="400" style="border: 1px solid #999; cursor: crosshair;"></canvas>
  <canvas id="loss-chart" width="400" height="150" style="border: 1px solid #999;"></canvas>

  <script>
    const SIZE = 400;
    const GRID = 20;
    const LR = 0.2;
    const LAYERS = '[8, 8, 1]';
    const BLUE = '#2a78d6';
    const RED = '#e34948';

    const board = document.getElementById('board');
    const ctx = board.getContext('2d');
    const chart = document.getElementById('loss-chart');
    const chartCtx = chart.getContext('2d');

    let py;
    let running = false;
    let step = 0;
    let losses = [];

    async function main() {
      py = await loadPyodide();
      for (const name of ['back_propagation.py', 'neural_network.py', 'train.py']) {
        const code = await (await fetch(name)).text();
        py.FS.writeFile(name, code);
      }
      py.runPython(`
from train import make_dataset, make_model, train_step, predict, accuracy
dots = make_dataset(30)
model = make_model(2, ${LAYERS})
centers = [-1 + (i + 0.5) * 2 / ${GRID} for i in range(${GRID})]
`);

      document.getElementById('message').textContent = 'Ready!';
      document.getElementById('train-button').addEventListener('click', toggleTraining);
      document.getElementById('clear-button').addEventListener('click', clearDots);
      document.getElementById('reset-button').addEventListener('click', newNetwork);
      board.addEventListener('click', addDot);
      board.addEventListener('contextmenu', (event) => { event.preventDefault(); addDot(event, true); });

      drawBoard();
      drawLoss();
    }

    function dotCount() {
      return py.runPython('len(dots)');
    }

    function trainSteps(n) {
      if (dotCount() === 0) return;
      const [loss, acc] = py.runPython(`
for _ in range(${n}):
    loss = train_step(model, dots, ${LR})
[loss, accuracy(model, dots)]
`).toJs();
      step += n;
      losses.push(loss);
      document.getElementById('step').textContent = step;
      document.getElementById('loss').textContent = loss.toFixed(4);
      document.getElementById('accuracy').textContent = Math.round(acc * 100) + '%';
    }

    function toggleTraining() {
      running = !running;
      document.getElementById('train-button').textContent = running ? 'Pause' : 'Train';
      if (running) loop();
    }

    function loop() {
      if (!running) return;
      trainSteps(1);
      drawBoard();
      drawLoss();
      requestAnimationFrame(loop);
    }

    function toPixelX(x) { return (x + 1) / 2 * SIZE; }
    function toPixelY(y) { return (1 - y) / 2 * SIZE; }

    function drawBoard() {
      ctx.clearRect(0, 0, SIZE, SIZE);

      const grid = py.runPython('[[predict(model, x, y) for x in centers] for y in centers]').toJs();
      const cell = SIZE / GRID;
      for (let row = 0; row < GRID; row++) {
        for (let col = 0; col < GRID; col++) {
          const guess = Math.max(-1, Math.min(1, grid[row][col]));
          const strength = Math.abs(guess) * 0.45;
          ctx.fillStyle = guess > 0 ? `rgba(42, 120, 214, ${strength})` : `rgba(227, 73, 72, ${strength})`;
          ctx.fillRect(col * cell, (GRID - 1 - row) * cell, cell, cell);
        }
      }

      const dots = py.runPython('dots').toJs();
      for (const [x, y, label] of dots) {
        const px = toPixelX(x);
        const pyy = toPixelY(y);
        ctx.fillStyle = label > 0 ? BLUE : RED;
        ctx.strokeStyle = 'white';
        ctx.lineWidth = 2;
        ctx.beginPath();
        if (label > 0) ctx.arc(px, pyy, 6, 0, Math.PI * 2);
        else ctx.rect(px - 6, pyy - 6, 12, 12);
        ctx.fill();
        ctx.stroke();
      }
    }

    function drawLoss() {
      chartCtx.clearRect(0, 0, chart.width, chart.height);
      if (losses.length < 2) return;

      const maxLoss = Math.max(...losses);
      chartCtx.strokeStyle = '#4a3aa7';
      chartCtx.lineWidth = 2;
      chartCtx.beginPath();
      losses.forEach((loss, i) => {
        const x = i / (losses.length - 1) * chart.width;
        const y = chart.height - 10 - loss / maxLoss * (chart.height - 20);
        if (i === 0) chartCtx.moveTo(x, y);
        else chartCtx.lineTo(x, y);
      });
      chartCtx.stroke();
    }

    function addDot(event, red = false) {
      const rect = board.getBoundingClientRect();
      const x = (event.clientX - rect.left) / rect.width * 2 - 1;
      const y = 1 - (event.clientY - rect.top) / rect.height * 2;
      const label = red || event.shiftKey ? -1 : 1;
      py.runPython(`dots.append((${x}, ${y}, ${label}))`);
      drawBoard();
    }

    function clearDots() {
      py.runPython('dots.clear()');
      resetStats();
      drawBoard();
      drawLoss();
    }

    function newNetwork() {
      py.runPython(`model = make_model(2, ${LAYERS})`);
      resetStats();
      drawBoard();
      drawLoss();
    }

    function resetStats() {
      step = 0;
      losses = [];
      document.getElementById('step').textContent = '0';
      document.getElementById('loss').textContent = '-';
      document.getElementById('accuracy').textContent = '-';
    }

    main();
  </script>
</body>
</html>
