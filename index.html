<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Backprop Playground</title>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.27.8/full/pyodide.js"></script>
</head>
<body>

  <h1>Back propagation online visualization with neural network training</h1>
  <p> Visualize machine learning model using back propagation to separate dots of 2 colours</p>

  <p id="message">Loading...</p>

  <p>L = (a × b + c) × f, with b = -3, c = 10, f = -2</p>

  <p>
    a = <span id="a-value">2.00</span>
    <input type="range" id="a-slider" min="-7.5" max="7.5" step="0.1" value="2">
  </p>

  <p>L = <span id="L-value">?</span></p>
  <p>a.grad = <span id="a-grad">?</span></p>

  <script>
    let py;

    async function main() {
      py = await loadPyodide();

      const response = await fetch('back_propagation.py');
      const code = await response.text();
      py.FS.writeFile('back_propagation.py', code);

      document.getElementById('message').textContent = 'Ready! Drag the slider.';
      document.getElementById('a-slider').addEventListener('input', update);
      update();
    }

    function update() {
      const a = Number(document.getElementById('a-slider').value);
      document.getElementById('a-value').textContent = a.toFixed(2);

      const result = py.runPython(`
from back_propagation import Value
a = Value(${a}, label='a')
b = Value(-3.0, label='b')
c = Value(10.0, label='c')
f = Value(-2.0, label='f')
e = a*b
d = e + c
L = d*f
L.backward()
[L.data, a.grad]
`).toJs();

      document.getElementById('L-value').textContent = result[0].toFixed(3);
      document.getElementById('a-grad').textContent = result[1].toFixed(3);
    }

    main();
  </script>
</body>
</html>
